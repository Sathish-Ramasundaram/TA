<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS z-index Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS z-index (Layering Elements)</h1>

    <div class="container">
        <div class="box box1">Box 1<br>z-index: 1</div>
        <div class="box box2">Box 2<br>z-index: 2</div>
        <div class="box box3">Box 3<br>z-index: 3</div>
    </div>

</body>
</html>
