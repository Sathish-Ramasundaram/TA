<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card Layout Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Card Layout Practice</h1>

    <div class="card">
        <img src="Tree.png" alt="Card Image" class="card-img">
        <div class="card-content">
            <h2 class="card-title">Card Title</h2>
            <p class="card-desc">
                This is a description for the card. You can add some text to explain what this card is about.
            </p>
            <a href="#" class="card-btn">Read More</a>
        </div>
    </div>

</body>
</html>
