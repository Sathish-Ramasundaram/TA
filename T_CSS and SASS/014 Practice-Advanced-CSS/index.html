<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive 2-Column Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Responsive 2-Column Layout</h1>

    <div class="container">
        <div class="column column-left">
            <h2>Left Column</h2>
            <p>This is the left column. It has some text to demonstrate the layout.</p>
        </div>
        <div class="column column-right">
            <h2>Right Column</h2>
            <p>This is the right column. It also has some text to demonstrate the layout.</p>
        </div>
    </div>

</body>
</html>
