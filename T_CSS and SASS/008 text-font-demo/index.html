<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text & Font Properties</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Text & Font Properties Demo</h1>

    <p class="font-family">
        This paragraph demonstrates font-family.
    </p>

    <p class="font-size">
        This paragraph demonstrates font-size.
    </p>

    <p class="line-height">
        This paragraph demonstrates line-height. <br>
        Notice the space between lines.
    </p>

    <p class="text-align">
        This paragraph demonstrates text-align.
    </p>

    <a href="#" class="text-decoration">
        This link demonstrates text-decoration.
    </a>

</body>
</html>
