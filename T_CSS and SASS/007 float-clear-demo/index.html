<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Float & Clear Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Float & Clear Demo</h1>

    <div class="container">
        <div class="box left">Float Left</div>
        <div class="box right">Float Right</div>
        <div class="clear"></div>
    </div>

    <p>
        This paragraph appears below the floated boxes because of
        <strong>clear: both</strong>.
    </p>

</body>
</html>
