<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Selectors & Cascading Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="title">CSS Selectors & Cascading</h1>

    <div class="container">
        <p>This paragraph inherits color from its parent.</p>

        <p class="text">This paragraph uses a CLASS selector.</p>

        <p id="unique">This paragraph uses an ID selector.</p>

        <p class="text highlight">This has multiple classes.</p>

        <p style="color: purple;">
            This paragraph uses INLINE style.
        </p>
    </div>

</body>
</html>
